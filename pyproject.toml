[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blender-synthgen-mcp"
version = "0.0.1"
description = "Procedural 3D synthetic-data toolkit for Blender: grounded node schemas, a lazy scene-graph walker, and a Houdini->Blender knowledge base — includes a self-contained Blender addon MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "scott" }]
keywords = ["blender", "geometry-nodes", "houdini", "synthetic-data", "mcp", "procedural"]
dependencies = ["mcp[cli]>=1.3.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# bpy is NOT a hard dependency. Install one matching your Blender for headless use:
#   pip install bpy==<blender-version>
blender = ["bpy"]

[project.scripts]
synthgen-schema = "synthgen.schema.query:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synthgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
